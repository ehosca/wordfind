<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="google" content="notranslate" />
    <title>Wordfind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>WORD<span class="accent">FIND</span></h1>
        <p class="tagline" id="tagline">find the hidden words</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </header>
      <main class="play">
        <aside class="words">
          <h2 id="find-heading"><span id="list-theme">Find</span><span id="list-count" class="count"></span></h2>
          <ul id="wordlist"></ul>
          <div id="status" class="status" aria-live="polite"></div>
        </aside>
        <div class="board-stack">
          <div class="board-toolbar">
            <div class="controls">
              <label class="control">
                <span id="label-lang">Language</span>
                <select id="lang"></select>
              </label>
              <label class="control">
                <span id="label-size">Size</span>
                <select id="size">
                  <option value="10">10</option>
                  <option value="12" selected>12</option>
                  <option value="14">14</option>
                  <option value="16">16</option>
                </select>
              </label>
              <button id="newgame">New Game</button>
            </div>
            <div id="timer" class="timer">0:00</div>
          </div>
          <div class="board">
            <div id="grid" class="grid"></div>
            <svg id="lines" class="lines" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="win-overlay" class="win-overlay" hidden>
              <div id="confetti" class="confetti" aria-hidden="true"></div>
              <div class="win-card" role="status">
                <div class="win-title" id="win-title"></div>
                <div class="win-time" id="win-time"></div>
                <div class="win-sub" id="win-sub"></div>
                <button id="play-again" type="button"></button>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer class="footer">
        <a href="https://hosca.com">hosca.com</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
